<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Corpilla | Reviews</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #f4f4f4;
      margin: 0;
    }
    header {
      background: #1a1a2e;
      color: white;
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    nav a {
      color: white;
      margin-left: 1.2rem;
      text-decoration: none;
    }
    .container {
      max-width: 900px;
      margin: 2rem auto;
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
    }
    h2 {
      color: #3742fa;
    }
    input, textarea {
      width: 100%;
      margin-top: 1rem;
      padding: 0.75rem;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    .button {
      margin-top: 1rem;
      background: #3742fa;
      color: white;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .review {
      margin-top: 2rem;
      padding: 1rem;
      border-bottom: 1px solid #eee;
    }
    .review h4 {
      margin: 0;
      color: #222;
    }
    .review p {
      margin: 0.5rem 0 0 0;
      color: #555;
    }
  </style>
</head>
<body>
  <header>
    <h1>Corpilla</h1>
    <nav>
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('challenge') }}">Challenges</a>
      <a href="{{ url_for('upload') }}">Upload</a>
      <a href="{{ url_for('review') }}">Reviews</a>
      <a href="{{ url_for('leaderboard') }}">Leaderboard</a>
    </nav>
  </header>
  <div class="container">
    <h2>📝 Submit Your Experience</h2>
    <form method="POST" action="{{ url_for('review') }}">
      <label>Your Name</label>
      <input type="text" name="name" required />
      <label>Your Review</label>
      <textarea name="message" rows="5" required></textarea>
      <button class="button" type="submit">Submit Review</button>
    </form>

    <h3>📣 What Others Are Saying:</h3>
    {% for r in reviews %}
      <div class="review">
        <h4>{{ r.name }}</h4>
        <p>{{ r.message }}</p>
      </div>
    {% endfor %}
  </div>
</body>
</html>
