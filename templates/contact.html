<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corpilla | Contact</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #eef2f5; }
    header { background: #1a1a2e; padding: 1.5rem 2rem; color: white; display: flex; justify-content: space-between; }
    nav a { color: white; margin-left: 1rem; text-decoration: none; }
    .contact-form {
      max-width: 600px;
      margin: 3rem auto;
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .contact-form h2 { margin-top: 0; color: #333; }
    .contact-form input, .contact-form textarea {
      width: 100%;
      padding: 0.8rem;
      margin-bottom: 1.2rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }
    .contact-form button {
      background: #3742fa;
      color: white;
      padding: 0.7rem 2rem;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
    }
    footer {
      background: #1a1a2e;
      color: white;
      text-align: center;
      padding: 2rem;
      margin-top: 4rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Corpilla</h1>
    <nav>
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('review') }}">Reviews</a>
      <a href="{{ url_for('upload') }}">Upload</a>
      <a href="{{ url_for('challenge') }}">Challenge</a>
      <a href="{{ url_for('leaderboard') }}">Leaderboard</a>
      <a href="{{ url_for('success') }}">Success</a>
      <a href="{{ url_for('contact') }}">Contact</a>
    </nav>
  </header>

  <div class="contact-form">
    <h2>Reach Out To Us</h2>
    <form>
      <input type="text" placeholder="Your Name" required>
      <input type="email" placeholder="Your Email" required>
      <textarea rows="5" placeholder="Your Message" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </div>

  <footer>
    <p>&copy; 2025 Corpilla. We'll reply within 48 hours. Promise.</p>
  </footer>
</body>
</html>
